<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effective Range - Coverage Analysis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="hud">
    <div class="hud-title">
      <span class="mark">RANGE COVERAGER COMPUTER</span>
      <span class="sub">EFFECTIVE FLIGHT RANGE // COVERAGE ANALYSIS AMONG BASES - AKAINAMI 2026</span>
    </div>
    <div class="hud-status">
      <span><span class="dot"></span>SYSTEM NOMINAL</span>
      <span id="clock">--:--:--Z</span>
    </div>
  </header>

  <div class="body">
    <div class="sidebar">

      <div id="errorBanner" class="error-banner"></div>

      <div class="panel">
        <h2>MISSION PARAMETERS</h2>
        <div class="field">
          <label>Mission Range — Climb + Cruise + Descent (NM)</label>
          <input type="number" id="missionDistanceNm" value="400" step="10">
        </div>
        <div class="row3">
          <div class="field">
            <label>Cruise Altitude (FT)</label>
            <input type="number" id="cruiseAltitudeFt" value="28000" step="1000">
          </div>
          <div class="field">
            <label>Cruise Speed (KCAS)</label>
            <input type="number" id="cruiseKcas" value="300" step="5">
          </div>
          <div class="field">
            <label>ISA Deviation (°C)</label>
            <input type="number" id="deltaIsaC" value="0" step="1">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Wind Speed (KT)</label>
            <input type="number" id="windSpeedKt" value="40" step="5">
          </div>
          <div class="field">
            <label>Wind Direction (N°)</label>
            <input type="number" id="windFromDeg" value="0" step="10" min="0" max="359">
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>OPERATING BASES</h2>
        <table class="bases" id="basesTable">
          <thead><tr><th>ICAO</th><th>AD</th><th>LAT</th><th>LON</th><th></th></tr></thead>
          <tbody id="basesTbody"></tbody>
        </table>
        <button class="btn" id="addBaseBtn">+ PİST EKLE</button>
      </div>

      <div class="panel">
        <h2>PERFORMANCE RESULTS</h2>
        <div id="resultsBox"></div>
      </div>

      <div class="panel">
        <h2>LEGEND</h2>
        <div class="legend-item"><span class="swatch" style="background:rgba(51,230,160,0.35);"></span>Coverage Area</div>
        <div class="legend-item"><span class="swatch" style="background:rgba(61,230,200,0.9);"></span>Coverage Envelope</div>
        <div class="legend-item"><span class="swatch" style="background:#0a1420; border:2px solid var(--cyan);"></span>Airbase</div>
      </div>

    </div>

    <div class="map-wrap">
      <div class="layer-toggle" id="layerToggle">
        <button data-layer="google" class="active">GOOGLE</button>
        <button data-layer="osm">OSM</button>
        <button data-layer="skyvector">SKYVECTOR</button>
      </div>
      <div id="map"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="script.js"></script>
</body>
</html>
